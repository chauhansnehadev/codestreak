<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problems - CodeStreak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <nav class="sidebar" id="app-sidebar"></nav>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="page-title-box">
          <h1>Problem Management</h1>
          <p>Track, organize, and log your DSA problem-solving progress</p>
        </div>
        <div class="top-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add New Problem</button>
        </div>
      </header>

      <main class="content-body">
        <!-- Search and Filters Bar -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
          <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
            <div style="flex: 2; min-width: 220px;">
              <input type="text" id="filter-search" class="form-control" placeholder="Search problem title...">
            </div>

            <div style="flex: 1; min-width: 140px;">
              <select id="filter-status" class="form-control">
                <option value="">All Statuses</option>
                <option value="SOLVED">Solved</option>
                <option value="ATTEMPTED">Attempted</option>
                <option value="REVISION_NEEDED">Revision Needed</option>
                <option value="NOT_STARTED">Not Started</option>
              </select>
            </div>

            <div style="flex: 1; min-width: 130px;">
              <select id="filter-difficulty" class="form-control">
                <option value="">All Difficulties</option>
                <option value="EASY">Easy</option>
                <option value="MEDIUM">Medium</option>
                <option value="HARD">Hard</option>
              </select>
            </div>

            <div style="flex: 1; min-width: 150px;">
              <select id="filter-topic" class="form-control">
                <option value="">All Topics</option>
              </select>
            </div>

            <div style="flex: 1; min-width: 140px;">
              <select id="filter-platform" class="form-control">
                <option value="">All Platforms</option>
              </select>
            </div>

            <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset</button>
          </div>
        </div>

        <!-- Problems Table -->
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Title</th>
                <th>Platform</th>
                <th>Difficulty</th>
                <th>Topics</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="problems-tbody">
              <tr><td colspan="7" style="text-align: center; color: var(--text-dim); padding: 2rem;">Loading problems...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Problem Modal -->
  <div class="modal-overlay" id="problem-modal">
    <div class="modal-content" style="max-width: 580px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add Problem</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <form id="problem-form">
        <input type="hidden" id="modal-prob-id">

        <div class="form-group">
          <label class="form-label" for="prob-title">Problem Title *</label>
          <input type="text" id="prob-title" class="form-control" placeholder="e.g. Trapping Rain Water" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="prob-url">Problem URL</label>
          <input type="url" id="prob-url" class="form-control" placeholder="https://leetcode.com/problems/...">
        </div>

        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="prob-platform">Platform</label>
            <select id="prob-platform" class="form-control">
              <option value="">Select Platform</option>
            </select>
          </div>

          <div class="form-group" style="flex: 1;">
            <label class="form-label" for="prob-difficulty">Difficulty *</label>
            <select id="prob-difficulty" class="form-control" required>
              <option value="EASY">Easy</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HARD">Hard</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">DSA Topics</label>
          <div id="modal-topics-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem; max-height: 110px; overflow-y: auto; padding: 0.5rem; background: var(--bg-input); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
            <!-- Topic Checkboxes -->
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="prob-status">My Status</label>
          <select id="prob-status" class="form-control">
            <option value="NOT_STARTED">Not Started</option>
            <option value="ATTEMPTED">Attempted</option>
            <option value="SOLVED">Solved</option>
            <option value="REVISION_NEEDED">Revision Needed</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="prob-notes">Personal Notes / Approach</label>
          <textarea id="prob-notes" class="form-control" rows="3" placeholder="Key idea, time & space complexity, tricky edge cases..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-prob-btn">Save Problem</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let masterTopics = [];
    let masterPlatforms = [];
    let currentProblems = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await App.init('problems');
      await loadMasterData();
      await fetchProblems();

      // Debounced search & filter listeners
      document.getElementById('filter-search').addEventListener('input', debounce(fetchProblems, 300));
      document.getElementById('filter-status').addEventListener('change', fetchProblems);
      document.getElementById('filter-difficulty').addEventListener('change', fetchProblems);
      document.getElementById('filter-topic').addEventListener('change', fetchProblems);
      document.getElementById('filter-platform').addEventListener('change', fetchProblems);
    });

    function debounce(func, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => func(...args), delay);
      };
    }

    async function loadMasterData() {
      try {
        const [topRes, platRes] = await Promise.all([
          fetch('/codestreak/api/topics'),
          fetch('/codestreak/api/platforms')
        ]);
        const topJson = await topRes.json();
        const platJson = await platRes.json();

        if (topJson.success) masterTopics = topJson.data;
        if (platJson.success) masterPlatforms = platJson.data.platforms;

        // Populate filters
        const topSelect = document.getElementById('filter-topic');
        masterTopics.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = t.name;
          topSelect.appendChild(opt);
        });

        const platSelect = document.getElementById('filter-platform');
        const modalPlat = document.getElementById('prob-platform');
        masterPlatforms.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          platSelect.appendChild(opt);

          const mOpt = document.createElement('option');
          mOpt.value = p.id;
          mOpt.textContent = p.name;
          modalPlat.appendChild(mOpt);
        });

        // Render topic checkboxes for modal
        const topicsDiv = document.getElementById('modal-topics-list');
        topicsDiv.innerHTML = '';
        masterTopics.forEach(t => {
          const lbl = document.createElement('label');
          lbl.style.cssText = 'font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; color: var(--text-muted);';
          lbl.innerHTML = `<input type="checkbox" name="topic-cb" value="${t.id}"> ${t.name}`;
          topicsDiv.appendChild(lbl);
        });
      } catch (e) {
        console.error('Master data load failed', e);
      }
    }

    async function fetchProblems() {
      const search = document.getElementById('filter-search').value.trim();
      const status = document.getElementById('filter-status').value;
      const difficulty = document.getElementById('filter-difficulty').value;
      const topicId = document.getElementById('filter-topic').value;
      const platformId = document.getElementById('filter-platform').value;

      const params = new URLSearchParams();
      if (search) params.append('search', search);
      if (status) params.append('status', status);
      if (difficulty) params.append('difficulty', difficulty);
      if (topicId) params.append('topicId', topicId);
      if (platformId) params.append('platformId', platformId);

      const tbody = document.getElementById('problems-tbody');
      try {
        const res = await fetch(`/codestreak/api/problems?${params.toString()}`);
        const json = await res.json();
        if (json.success) {
          currentProblems = json.data;
          renderProblemsTable(json.data);
        }
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #ef4444;">Failed to load problems</td></tr>';
      }
    }

    function renderProblemsTable(problems) {
      const tbody = document.getElementById('problems-tbody');
      tbody.innerHTML = '';

      if (problems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-dim); padding: 2.5rem;">No problems found matching criteria.</td></tr>';
        return;
      }

      problems.forEach((p, index) => {
        const diffBadge = `<span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span>`;

        let statusClass = 'badge-not-started';
        let statusText = 'Not Started';
        if (p.userStatus === 'SOLVED') {
          statusClass = 'badge-solved';
          statusText = 'Solved';
        } else if (p.userStatus === 'ATTEMPTED') {
          statusClass = 'badge-attempted';
          statusText = 'Attempted';
        } else if (p.userStatus === 'REVISION_NEEDED') {
          statusClass = 'badge-revision';
          statusText = 'Revision';
        }

        const topicsBadges = (p.topics && p.topics.length > 0)
          ? p.topics.map(t => `<span style="display: inline-block; padding: 2px 6px; font-size: 0.725rem; background: rgba(255,255,255,0.06); border-radius: 4px; margin-right: 4px;">${t.name}</span>`).join('')
          : '<span style="color: var(--text-dim); font-size: 0.8rem;">-</span>';

        const titleDisplay = p.url
          ? `<a href="${p.url}" target="_blank" rel="noopener" style="color: var(--text-main); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
               ${p.title}
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
             </a>`
          : `<span style="font-weight: 600;">${p.title}</span>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color: var(--text-dim); font-family: var(--font-mono); font-size: 0.8rem;">${p.id}</td>
          <td>${titleDisplay}</td>
          <td style="color: var(--text-muted); font-size: 0.85rem;">${p.platformName || 'General'}</td>
          <td>${diffBadge}</td>
          <td>${topicsBadges}</td>
          <td>
            <select class="form-control" style="padding: 3px 8px; font-size: 0.8rem; width: auto; display: inline-block;" onchange="updateStatus(${p.id}, this.value)">
              <option value="NOT_STARTED" ${p.userStatus === 'NOT_STARTED' ? 'selected' : ''}>Not Started</option>
              <option value="ATTEMPTED" ${p.userStatus === 'ATTEMPTED' ? 'selected' : ''}>Attempted</option>
              <option value="SOLVED" ${p.userStatus === 'SOLVED' ? 'selected' : ''}>Solved</option>
              <option value="REVISION_NEEDED" ${p.userStatus === 'REVISION_NEEDED' ? 'selected' : ''}>Revision Needed</option>
            </select>
          </td>
          <td>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary btn-sm" onclick="editProblemModal(${p.id})" title="Edit problem details">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProblem(${p.id})" title="Delete">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateStatus(probId, status) {
      try {
        const res = await fetch(`/codestreak/api/problems/${probId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const json = await res.json();
        if (json.success) {
          App.toast(`Status updated to ${status}`);
        } else {
          App.toast(json.error, 'error');
        }
      } catch (e) {
        App.toast('Failed to update status', 'error');
      }
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Problem';
      document.getElementById('modal-prob-id').value = '';
      document.getElementById('prob-title').value = '';
      document.getElementById('prob-url').value = '';
      document.getElementById('prob-platform').value = '';
      document.getElementById('prob-difficulty').value = 'MEDIUM';
      document.getElementById('prob-status').value = 'NOT_STARTED';
      document.getElementById('prob-notes').value = '';
      document.querySelectorAll('input[name="topic-cb"]').forEach(cb => cb.checked = false);

      document.getElementById('problem-modal').classList.add('active');
    }

    function editProblemModal(id) {
      const prob = currentProblems.find(p => p.id === id);
      if (!prob) return;

      document.getElementById('modal-title').textContent = 'Edit Problem';
      document.getElementById('modal-prob-id').value = prob.id;
      document.getElementById('prob-title').value = prob.title;
      document.getElementById('prob-url').value = prob.url || '';
      document.getElementById('prob-platform').value = prob.platformId || '';
      document.getElementById('prob-difficulty').value = prob.difficulty;
      document.getElementById('prob-status').value = prob.userStatus || 'NOT_STARTED';
      document.getElementById('prob-notes').value = prob.userNotes || '';

      const topicIds = (prob.topics || []).map(t => t.id);
      document.querySelectorAll('input[name="topic-cb"]').forEach(cb => {
        cb.checked = topicIds.includes(parseInt(cb.value));
      });

      document.getElementById('problem-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('problem-modal').classList.remove('active');
    }

    document.getElementById('problem-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('modal-prob-id').value;
      const title = document.getElementById('prob-title').value.trim();
      const url = document.getElementById('prob-url').value.trim();
      const platformId = document.getElementById('prob-platform').value ? parseInt(document.getElementById('prob-platform').value) : null;
      const difficulty = document.getElementById('prob-difficulty').value;
      const status = document.getElementById('prob-status').value;
      const notes = document.getElementById('prob-notes').value.trim();

      const topicIds = [];
      document.querySelectorAll('input[name="topic-cb"]:checked').forEach(cb => {
        topicIds.push(parseInt(cb.value));
      });

      const payload = { title, url, platformId, difficulty, status, notes, topicIds };

      try {
        const method = id ? 'PUT' : 'POST';
        const endpoint = id ? `/codestreak/api/problems/${id}` : '/codestreak/api/problems';

        const res = await fetch(endpoint, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.success) {
          App.toast(id ? 'Problem updated' : 'Problem created');
          closeModal();
          fetchProblems();
        } else {
          App.toast(json.error || 'Failed to save', 'error');
        }
      } catch (err) {
        App.toast('Network error saving problem', 'error');
      }
    });

    async function deleteProblem(id) {
      if (!confirm('Are you sure you want to remove this problem from your list?')) return;
      try {
        const res = await fetch(`/codestreak/api/problems/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          App.toast('Problem removed');
          fetchProblems();
        } else {
          App.toast(json.error, 'error');
        }
      } catch (e) {
        App.toast('Failed to delete problem', 'error');
      }
    }

    function resetFilters() {
      document.getElementById('filter-search').value = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-difficulty').value = '';
      document.getElementById('filter-topic').value = '';
      document.getElementById('filter-platform').value = '';
      fetchProblems();
    }
  </script>
</body>
</html>
