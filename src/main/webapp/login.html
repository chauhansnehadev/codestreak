<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - CodeStreak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, #1e293b 0%, #0b1120 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header .brand-icon {
      margin: 0 auto 1rem;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .auth-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .demo-hint {
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: rgba(20, 184, 166, 0.08);
      border: 1px dashed rgba(20, 184, 166, 0.3);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
    .demo-hint strong {
      color: var(--accent-teal);
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">⚡</div>
      <h1>Welcome to CodeStreak</h1>
      <p>Log in to track your DSA prep across platforms</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username or Email</label>
        <input type="text" id="username" class="form-control" placeholder="demouser" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <div class="demo-hint">
      <strong>Demo Account:</strong> Username: <code>demouser</code> &bull; Password: <code>password123</code>
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--accent-teal); text-decoration: none; font-weight: 600;">Create one</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/codestreak/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = 'dashboard.html';
        } else {
          App.toast(data.error || 'Authentication failed', 'error');
        }
      } catch (err) {
        App.toast('Network error while connecting to server', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
