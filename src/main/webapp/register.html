<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - CodeStreak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, #1e293b 0%, #0b1120 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header .brand-icon {
      margin: 0 auto 1rem;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">⚡</div>
      <h1>Create an Account</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Start your structured DSA journey today</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Alex Developer" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="alex_coder" required minlength="3">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="alex@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min 6 chars)</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" id="reg-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Get Started
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Already have an account? <a href="login.html" style="color: var(--accent-teal); text-decoration: none; font-weight: 600;">Sign in</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/codestreak/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, username, email, password })
        });
        const data = await res.json();
        if (data.success) {
          App.toast('Account created successfully!');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          App.toast(data.error || 'Registration failed', 'error');
        }
      } catch (err) {
        App.toast('Server connection failed', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Get Started';
      }
    });
  </script>
</body>
</html>
