<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSA Roadmap - CodeStreak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .roadmap-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
    }
    .roadmap-list::before {
      content: '';
      position: absolute;
      left: 28px;
      top: 24px;
      bottom: 24px;
      width: 2px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 1;
    }
    .roadmap-step {
      display: flex;
      gap: 1.25rem;
      position: relative;
      z-index: 2;
    }
    .step-number {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .roadmap-step.completed .step-number {
      border-color: var(--color-easy);
      background: var(--color-easy-bg);
      color: var(--color-easy);
    }
    .roadmap-step.in-progress .step-number {
      border-color: var(--accent-teal);
      background: rgba(20, 184, 166, 0.15);
      color: var(--accent-teal);
      box-shadow: 0 0 15px rgba(20, 184, 166, 0.35);
    }
    .step-content {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      transition: var(--transition);
    }
    .step-content:hover {
      border-color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <nav class="sidebar" id="app-sidebar"></nav>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="page-title-box">
          <h1>Curated DSA Mastery Roadmap</h1>
          <p>Topic-by-topic sequence from fundamental linear structures to dynamic programming</p>
        </div>
        <div class="top-actions">
          <div style="font-size: 0.85rem; color: var(--text-muted);">
            Overall Completion: <strong id="roadmap-pct" style="color: var(--accent-teal);">0%</strong>
          </div>
        </div>
      </header>

      <main class="content-body">
        <!-- Progress Summary Header -->
        <div class="card" style="margin-bottom: 2rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <div>
              <h2 style="font-size: 1.25rem; font-weight: 700;">Standard DSA Mastery Roadmap</h2>
              <p style="font-size: 0.85rem; color: var(--text-muted);">Master the 12 fundamental pillars of algorithmic problem solving.</p>
            </div>
            <div style="text-align: right;">
              <span id="topic-counts-text" style="font-size: 0.9rem; font-weight: 600;">0 of 12 Topics Completed</span>
            </div>
          </div>
          <div style="background: rgba(255,255,255,0.06); height: 10px; border-radius: 5px; overflow: hidden;">
            <div id="roadmap-bar" style="background: linear-gradient(90deg, var(--accent-teal), var(--accent-cyan)); width: 0%; height: 100%; transition: width 0.5s ease;"></div>
          </div>
        </div>

        <!-- Interactive Step by Step Timeline -->
        <div class="roadmap-list" id="roadmap-container">
          <!-- Rendered steps -->
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await App.init('roadmap');
      loadRoadmap();
    });

    async function loadRoadmap() {
      try {
        const res = await fetch('/codestreak/api/roadmap');
        const json = await res.json();
        if (!json.success) return;

        const data = json.data;
        document.getElementById('roadmap-pct').textContent = `${data.progressPercent}%`;
        document.getElementById('roadmap-bar').style.width = `${data.progressPercent}%`;
        document.getElementById('topic-counts-text').textContent = `${data.completedTopics} of ${data.totalTopics} Topics Completed`;

        renderSteps(data.topics);
      } catch (e) {
        console.error('Failed to load roadmap', e);
      }
    }

    function renderSteps(topics) {
      const container = document.getElementById('roadmap-container');
      container.innerHTML = '';

      topics.forEach((t, i) => {
        let stepClass = '';
        if (t.userStatus === 'COMPLETED') stepClass = 'completed';
        else if (t.userStatus === 'IN_PROGRESS') stepClass = 'in-progress';

        const stepEl = document.createElement('div');
        stepEl.className = `roadmap-step ${stepClass}`;

        const solvedCount = t.solvedProblemsCount || 0;
        const targetCount = t.targetProblems || 10;
        const pct = Math.min(100, Math.round((solvedCount / targetCount) * 100));

        stepEl.innerHTML = `
          <div class="step-number">${t.sequenceOrder || (i + 1)}</div>
          <div class="step-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
              <div>
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem;">${t.topicName}</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted);">${t.topicDescription || ''}</p>
              </div>
              <div>
                <select class="form-control" style="font-size: 0.8rem; padding: 4px 10px; width: auto;" onchange="updateTopicStatus(${t.id}, this.value)">
                  <option value="NOT_STARTED" ${t.userStatus === 'NOT_STARTED' ? 'selected' : ''}>Not Started</option>
                  <option value="IN_PROGRESS" ${t.userStatus === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                  <option value="COMPLETED" ${t.userStatus === 'COMPLETED' ? 'selected' : ''}>Completed</option>
                </select>
              </div>
            </div>

            <div style="margin-top: 1rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim);">
              <span>Practice Target: <strong>${solvedCount} / ${targetCount}</strong> problems solved</span>
              <a href="problems.html" style="color: var(--accent-teal); text-decoration: none; font-weight: 600;">Practice Questions &rarr;</a>
            </div>

            <div style="background: rgba(255,255,255,0.06); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 0.5rem;">
              <div style="background: var(--accent-teal); width: ${pct}%; height: 100%;"></div>
            </div>
          </div>
        `;

        container.appendChild(stepEl);
      });
    }

    async function updateTopicStatus(roadmapTopicId, status) {
      try {
        const res = await fetch(`/codestreak/api/roadmap/${roadmapTopicId}/status`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const json = await res.json();
        if (json.success) {
          App.toast(`Topic status set to ${status}`);
          loadRoadmap();
        } else {
          App.toast(json.error, 'error');
        }
      } catch (e) {
        App.toast('Failed to update status', 'error');
      }
    }
  </script>
</body>
</html>
